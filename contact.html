
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Nor’easters Track Club</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>
  <header class="header">
    <div class="wrap nav">
      <a class="brand" href="index.html">NOR’EASTERS TRACK CLUB</a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="roster.html">Roster</a>
        <a href="members.html">Members</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap section narrow">
      <h1>Contact Us</h1>
      <p>
        Interested in joining Nor’easters or have a question?
        Send us a message.
      </p>

      <form
        action="https://formspree.io/f/meaadyzg"
        method="POST"
        class="contact-form">

        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required>

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required>

        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="wrap footer">
      <span>Nor’easters Track Club · Greater Boston</span>
      <a href="https://www.instagram.com/noreasterstrackclub/">
        Instagram
      </a>
    </div>
  </footer>

  <script src="assets/main.js"></script>
</body>
</html>
