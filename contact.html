
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Nor’easters Track Club</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>
  <header class="header">
    <div class="wrap nav">
      <a class="brand" href="index.html">NOR’EASTERS TRACK CLUB</a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="roster.html">Roster</a>
        <a href="members.html">Members</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap section narrow">
      <h1>Contact Us</h1>

      <p class="lead">
        Interested in joining the Nor’easters or have a question?
        Send us a message.
      </p>

      <form
        action="https://formspree.io/f/meaadyzg"
        method="POST">

        <label class="field">
          Name
          <input
            type="text"
            name="name"
            required>
        </label>

        <label class="field">
          Email
          <input
            type="email"
            name="email"
            required>
        </label>

        <label class="field">
          Message
          <textarea
            name="message"
            required></textarea>
        </label>

        <button class="button" type="submit">
          Send Message
        </button>
      </form>
    </section>
  </main>

  <footer>
    <div class="wrap footer">
      <span>Nor’easters Track Club · Greater Boston</span>
      <a href="https://www.instagram.com/noreasterstrackclub/">
        Instagram
      </a>
    </div>
  </footer>

  <script src="assets/main.js"></script>
</body>
</html>
